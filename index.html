<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#0D211B;
  --surface:#16332A;
  --surface2:#1E4235;
  --line:#2E5A4A;
  --text:#EDF2EA;
  --muted:#8FAF9F;
  --yellow:#F5C518;
  --yellow-dim:#8a7212;
  --flag:#E2483B;
  --disp:'Barlow Condensed', 'Helvetica Neue', Arial, sans-serif;
  --body:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);font-family:var(--body);
  font-size:16px;line-height:1.4;padding-bottom:84px;
  font-variant-numeric:tabular-nums;
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input,select{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text);width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}

/* ---------- cabecera ---------- */
header{
  position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line);
}
.eyebrow{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 16px 0;font-family:var(--disp);font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--muted);
}
.eyebrow .modo{color:var(--yellow)}
.holebar{display:flex;align-items:center;gap:12px;padding:6px 12px 12px}
.navbtn{
  width:54px;height:54px;border-radius:14px;background:var(--surface);
  border:1px solid var(--line);font-size:22px;color:var(--text);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
}
.navbtn:disabled{opacity:.3}
/* marca de tee amarilla = firma visual */
.teemark{
  flex:1;background:var(--yellow);color:#14261C;border-radius:14px;
  padding:8px 14px;display:flex;align-items:baseline;justify-content:space-between;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);
}
.teemark .num{font-family:var(--disp);font-weight:700;font-size:40px;line-height:1;letter-spacing:-.01em}
.teemark .num small{font-size:14px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;display:block;line-height:1;opacity:.65}
.teemark .meta{font-family:var(--disp);font-weight:600;font-size:15px;text-align:right;letter-spacing:.06em;text-transform:uppercase}

/* ---------- contenido ---------- */
main{padding:14px 12px 0;max-width:560px;margin:0 auto}
.sect-title{
  font-family:var(--disp);font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  font-size:12px;color:var(--muted);margin:22px 0 8px 4px;
}
.sect-title:first-child{margin-top:4px}

/* fila de jugador */
.prow{
  background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:12px;margin-bottom:10px;
}
.prow .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.pname{font-family:var(--disp);font-weight:700;font-size:24px;letter-spacing:.01em;line-height:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptag{font-size:12px;color:var(--muted);margin-top:3px;letter-spacing:.02em}
.dots{color:var(--yellow);letter-spacing:.1em}
.hpts{
  font-family:var(--disp);font-weight:700;font-size:30px;line-height:1;color:var(--yellow);
  min-width:56px;text-align:right;
}
.hpts small{display:block;font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;font-weight:600}
.stepper{display:flex;align-items:center;gap:10px}
.step{
  flex:0 0 62px;height:62px;border-radius:16px;background:var(--surface2);
  border:1px solid var(--line);font-size:30px;font-weight:600;line-height:1;
  display:flex;align-items:center;justify-content:center;
}
.step:active{background:var(--line)}
.val{
  flex:1;height:62px;border-radius:16px;background:#0A1A15;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;gap:8px;
  font-family:var(--disp);font-weight:700;font-size:34px;line-height:1;
}
.val .rel{font-size:15px;font-weight:600;padding:2px 7px;border-radius:6px}
.rel.under{background:var(--yellow);color:#14261C}
.rel.over{background:rgba(226,72,59,.18);color:#F2938A}
.rel.even{background:var(--line);color:var(--muted)}
.val.empty{color:var(--muted)}

/* clasificación */
.lead{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.lrow{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:none}
.lpos{font-family:var(--disp);font-weight:700;font-size:16px;color:var(--muted);width:18px}
.lname{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbar{height:6px;border-radius:3px;background:var(--yellow);min-width:2px;opacity:.75}
.lbarwrap{flex:0 0 84px;background:#0A1A15;border-radius:3px;overflow:hidden}
.ltot{font-family:var(--disp);font-weight:700;font-size:22px;min-width:44px;text-align:right}
.leader .ltot{color:var(--yellow)}

/* tarjeta */
/* tarjeta horizontal, dos bloques de nueve */
.sc{width:100%;table-layout:fixed;border-collapse:collapse;margin:0 0 4px}
.sc td{text-align:center;padding:3px 1px;font-size:13px}
.sc .nm{width:52px;text-align:left;padding-left:7px;font-family:var(--disp);font-weight:600;
  font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--text);
  white-space:nowrap;overflow:hidden}
.sc .tt{width:40px;background:rgba(255,255,255,.04)}
.sc tr.hn td{font-family:var(--disp);font-weight:700;font-size:13px;color:var(--yellow);
  letter-spacing:.06em;text-transform:uppercase;padding-bottom:5px}
.sc tr.hn .nm{color:var(--muted)}
.jump{font:inherit;color:inherit;padding:3px 0;width:100%}
.sc tr.ref td{font-size:11px;color:var(--muted);padding:2px 1px}
.sc tr.ref .nm{font-size:11px;color:var(--muted);font-weight:600}
.sc tr.pl td{border-top:1px solid var(--line);padding:5px 1px 6px}
.sc .gs{font-family:var(--disp);font-weight:700;font-size:16px;line-height:1.15;
  width:21px;height:21px;margin:0 auto;display:flex;align-items:center;justify-content:center}
.sc .gs.bird{border:1.5px solid var(--yellow);border-radius:50%}
.sc .gs.bog{border:1.5px solid rgba(226,72,59,.75)}
.sc .gs.dbl{border:1.5px solid rgba(226,72,59,.75);box-shadow:0 0 0 2.5px rgba(226,72,59,.22)}
.sc .ps{font-size:11px;font-weight:700;color:var(--yellow);line-height:1.3;min-height:14px}
.sc .ps.big{font-size:17px;font-family:var(--disp)}
.sc .tt .gs{color:var(--muted);font-size:13px;border:none;box-shadow:none}
.net{display:inline-block;font-size:10px;font-weight:700;padding:1px 4px;border-radius:4px;margin-top:2px}
.net.over{background:rgba(226,72,59,.2);color:#F2938A}
.net.under{background:var(--yellow);color:#14261C}
.net.even{background:var(--line);color:var(--muted)}
.sc td.now{background:rgba(245,197,24,.12)}
.sc.fin{margin-top:10px;border-top:2px solid var(--line);padding-top:4px}
.sc.fin td{width:auto}
.sc.fin .nm{width:34%}
.sc.fin tr.hn td{font-size:11px;color:var(--muted)}
.sc.fin .gs{width:auto;display:block;color:var(--muted)}

/* ajustes */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.field{margin-bottom:12px}
.field:last-child{margin-bottom:0}
label{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:600}
.two{display:flex;gap:10px}
.two>*{flex:1}
.slot{display:flex;gap:10px;align-items:flex-end;margin-bottom:10px}
.slot .n{flex:1}
.slot .h{flex:0 0 92px}
.slot .x{flex:0 0 46px;height:44px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-size:18px;color:var(--muted)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode{
  border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:11px 10px;text-align:left;
}
.mode.on{background:var(--yellow);color:#14261C;border-color:var(--yellow)}
.mode b{display:block;font-family:var(--disp);font-weight:700;font-size:18px;line-height:1.1}
.mode span{font-size:11px;opacity:.7;line-height:1.25;display:block;margin-top:2px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sw{flex:0 0 58px;height:32px;border-radius:16px;background:var(--surface2);border:1px solid var(--line);position:relative}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--muted);transition:.15s}
.sw.on{background:var(--yellow-dim);border-color:var(--yellow)}
.sw.on i{left:29px;background:var(--yellow)}
.note{font-size:12px;color:var(--muted);line-height:1.45;margin-top:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  border:1px solid var(--line);background:var(--surface2);border-radius:11px;
  padding:10px 14px;font-weight:600;font-size:15px;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;
}
.chip.on{background:var(--yellow);color:#14261C;border-color:var(--yellow)}
.bbbrow{margin-bottom:14px}
.bbbrow .lab{font-family:var(--disp);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:12px;color:var(--muted);margin-bottom:6px}
.danger{width:100%;padding:13px;border-radius:12px;background:transparent;border:1px solid var(--flag);color:#F2938A;font-weight:600}
.grid18{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hcell{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px}
.hcell .hn{font-family:var(--disp);font-weight:700;font-size:15px;color:var(--yellow)}
.hcell input{padding:6px 4px;text-align:center;font-size:14px;border-radius:7px}
.hcell .lb{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:4px 0 2px}

/* barra inferior */
nav{
  position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;
  background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  flex:1;padding:12px 4px 14px;font-family:var(--disp);font-weight:600;
  letter-spacing:.12em;text-transform:uppercase;font-size:13px;color:var(--muted);
  border-top:3px solid transparent;margin-top:-1px;
}
nav button.on{color:var(--yellow);border-top-color:var(--yellow)}
.hidden{display:none !important}
.saveflag{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:var(--surface2);
  border:1px solid var(--line);border-radius:20px;padding:7px 16px;font-size:13px;color:var(--muted);
  opacity:0;transition:.3s;pointer-events:none;z-index:40}
.saveflag.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>

<script>
const PAR_DEF = [4,5,3,4,4,3,4,5,4, 4,4,3,5,4,4,3,4,5];
const SI_DEF  = [7,3,10,15,1,18,11,5,13, 8,14,16,2,4,12,17,6,9];

const MODES = {
  nueve:{n:'Nueve Puntos', d:'5-3-1 por hoyo', lbl:'Nueve Puntos'},
  stable:{n:'Stableford', d:'Puntos sobre el par', lbl:'Stableford'},
  skins:{n:'Skins', d:'Gana el hoyo o va bote', lbl:'Skins'},
  bbb:{n:'Bingo Bango Bongo', d:'3 puntos por hoyo', lbl:'Bingo Bango Bongo'}
};

let S = null;
function fresh(){
  return {
    name:'Golf Santander · Amarillas',
    mode:'nueve', net:true, hole:0,
    players:[
      {name:'Jugador 1', hcp:18, on:true},
      {name:'Jugador 2', hcp:18, on:true},
      {name:'Jugador 3', hcp:18, on:true},
      {name:'', hcp:18, on:false}
    ],
    par:[...PAR_DEF], si:[...SI_DEF],
    scores:Array.from({length:18},()=>[null,null,null,null]),
    bbb:Array.from({length:18},()=>({bingo:null,bango:null,bongo:null}))
  };
}

/* ---------- guardado (local, funciona sin conexión) ---------- */
let saveT=null;
function save(){
  clearTimeout(saveT);
  saveT=setTimeout(()=>{
    try{
      localStorage.setItem('golf:partida', JSON.stringify(S));
      const f=document.getElementById('saveflag');
      f.classList.add('show'); setTimeout(()=>f.classList.remove('show'),900);
    }catch(e){}
  },400);
}
function load(){
  try{
    const v = localStorage.getItem('golf:partida');
    if(v){ const p=JSON.parse(v); if(p && p.players) return p; }
  }catch(e){}
  return fresh();
}

/* ---------- lógica ---------- */
const act = ()=>S.players.map((p,i)=>({...p,i})).filter(p=>p.on);
function recibidos(hcp,si){
  if(!S.net) return 0;
  const h=Math.round(hcp||0);
  if(h>=0) return Math.floor(h/18) + ((si <= h%18) ? 1 : 0);
  const n=-h; return (si > 18-n) ? -1 : 0;
}
function net(hole,pi){
  const g=S.scores[hole][pi]; if(g==null) return null;
  return g - recibidos(S.players[pi].hcp, S.si[hole]);
}
function valores(n){ return n<=2?[3,1] : n===3?[5,3,1] : [4,3,2,1]; }

// puntos del hoyo -> {playerIndex: puntos}, o null si falta gente
function puntosHoyo(h){
  const A=act(); const out={};
  if(S.mode==='bbb'){
    A.forEach(p=>out[p.i]=0);
    const b=S.bbb[h];
    ['bingo','bango','bongo'].forEach(k=>{ if(b[k]!=null && out[b[k]]!=null) out[b[k]]++; });
    return (b.bingo==null&&b.bango==null&&b.bongo==null)?null:out;
  }
  if(S.mode==='stable'){
    let any=false;
    A.forEach(p=>{
      const nt=net(h,p.i);
      if(nt==null){ out[p.i]=0; } else { any=true; out[p.i]=Math.max(0, S.par[h]+2-nt); }
    });
    return any?out:null;
  }
  // nueve puntos y skins necesitan a todos
  const nets = A.map(p=>net(h,p.i));
  if(nets.some(v=>v==null)) return null;
  if(S.mode==='nueve'){
    const vals = valores(A.length);
    const order = A.map((p,k)=>({i:p.i,v:nets[k]})).sort((a,b)=>a.v-b.v);
    const raw={}; order.forEach((o,k)=>raw[o.i]=vals[k]);
    // empates: se reparte la media
    let k=0;
    while(k<order.length){
      let j=k; while(j+1<order.length && order[j+1].v===order[k].v) j++;
      if(j>k){ let s=0; for(let z=k;z<=j;z++) s+=vals[z];
        const m=s/(j-k+1); for(let z=k;z<=j;z++) raw[order[z].i]=m; }
      k=j+1;
    }
    return raw;
  }
  // skins: se resuelve en la pasada acumulada
  const min=Math.min(...nets);
  const win=A.filter((p,k)=>nets[k]===min);
  A.forEach(p=>out[p.i]=0);
  if(win.length===1) out[win[0].i]=1; // valor base; el bote se suma en totales()
  return out;
}

// para skins: valor real de cada hoyo teniendo en cuenta el bote
function skinsDetalle(){
  const res=[]; let bote=1;
  for(let h=0;h<18;h++){
    const P=puntosHoyo(h);
    if(!P){ res.push(null); continue; }
    const g=Object.keys(P).find(k=>P[k]===1);
    if(g!=null){ res.push({win:+g,val:bote}); bote=1; }
    else { res.push({win:null,val:0}); bote++; }
  }
  return res;
}

function totales(){
  const A=act(); const t={}; A.forEach(p=>t[p.i]=0);
  let bote=1;
  for(let h=0;h<18;h++){
    const P=puntosHoyo(h);
    if(!P){ continue; }
    if(S.mode==='skins'){
      const g=Object.keys(P).find(k=>P[k]===1);
      if(g!=null){ t[g]+=bote; bote=1; } else { bote++; }
    } else {
      A.forEach(p=>t[p.i]+=(P[p.i]||0));
    }
  }
  return {t,bote};
}
function golpesTot(pi){
  let g=0,n=0;
  for(let h=0;h<18;h++) if(S.scores[h][pi]!=null){ g+=S.scores[h][pi]; n++; }
  return {g,n};
}

/* ---------- pintar ---------- */
function pintaHoyo(){
  const h=S.hole;
  document.getElementById('holeNum').textContent=h+1;
  document.getElementById('holePar').textContent='Par '+S.par[h];
  document.getElementById('holeSi').textContent='Hcp '+S.si[h];
  document.getElementById('prevH').disabled = h===0;
  document.getElementById('nextH').disabled = h===17;
  document.getElementById('modeLabel').textContent=MODES[S.mode].lbl+(S.net?'':' · bruto');
  document.getElementById('courseName').textContent=S.name;

  const P=puntosHoyo(h);
  const sk = S.mode==='skins' ? skinsDetalle()[h] : null;
  const box=document.getElementById('players'); box.innerHTML='';
  const bbbOn = S.mode==='bbb';
  act().forEach(p=>{
    const g=S.scores[h][p.i];
    const rec=recibidos(p.hcp,S.si[h]);
    const nt=g==null?null:g-rec;
    const d=nt==null?null:nt-S.par[h];
    const rel = d==null?'':`<span class="rel ${d<0?'under':d>0?'over':'even'}">${d>0?'+':''}${d}</span>`;
    let pts = P? (Math.round(P[p.i]*10)/10) : '—';
    if(S.mode==='skins') pts = sk ? (sk.win===p.i ? sk.val : 0) : '—';
    const el=document.createElement('div'); el.className='prow';
    el.innerHTML=`
      <div class="top">
        <div style="min-width:0">
          <div class="pname">${esc(p.name||'Jugador '+(p.i+1))}</div>
          <div class="ptag">Hcp ${p.hcp} ${rec>0?'<span class="dots">'+'•'.repeat(Math.min(rec,4))+'</span>':rec<0?'<span class="dots">−1</span>':''}</div>
        </div>
        <div class="hpts">${pts}<small>${S.mode==='skins'?'skin':'ptos'}</small></div>
      </div>
      <div class="stepper">
        <button class="step" data-m="-1" data-p="${p.i}">−</button>
        <div class="val ${g==null?'empty':''}">${g==null?'—':g}${rel}</div>
        <button class="step" data-m="1" data-p="${p.i}">+</button>
      </div>`;
    box.appendChild(el);
  });
  box.querySelectorAll('.step').forEach(b=>b.onclick=()=>{
    const pi=+b.dataset.p, m=+b.dataset.m, cur=S.scores[h][pi];
    let v = cur==null ? S.par[h] : cur+m;
    if(v<1) v=null;
    if(v!=null && v>15) v=15;
    S.scores[h][pi]=v; save(); pintaHoyo(); pintaTarjeta();
  });

  // Bingo Bango Bongo
  const bb=document.getElementById('bbbBox');
  bb.classList.toggle('hidden',!bbbOn);
  if(bbbOn){
    const b=S.bbb[h];
    const filas=[['bingo','Bingo · primero en green'],['bango','Bango · más cerca de bandera'],['bongo','Bongo · primero en embocar']];
    bb.innerHTML='<div class="card">'+filas.map(([k,lab])=>`
      <div class="bbbrow"><div class="lab">${lab}</div>
      <div class="chips">${act().map(p=>`<button class="chip ${b[k]===p.i?'on':''}" data-k="${k}" data-p="${p.i}">${esc((p.name||'J'+(p.i+1)).split(' ')[0])}</button>`).join('')}</div></div>`).join('')+'</div>';
    bb.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
      const k=c.dataset.k,pi=+c.dataset.p;
      S.bbb[h][k] = S.bbb[h][k]===pi ? null : pi;
      save(); pintaHoyo(); pintaTarjeta();
    });
  }

  pintaLead();
  const {bote}=totales();
  const nota=document.getElementById('holeNote');
  if(S.mode==='skins') nota.textContent = bote>1 ? `Bote acumulado: el próximo hoyo que alguien gane en solitario vale ${bote} skins.` : 'Si dos o más empatan el hoyo, el skin va al bote.';
  else if(S.mode==='nueve') nota.textContent='Se reparten '+(act().length===3?'9 puntos: 5 al mejor, 3 al segundo, 1 al tercero. Los empates se promedian.':'los puntos por orden. Los empates se promedian.');
  else if(S.mode==='stable') nota.textContent='Par neto = 2 puntos. Birdie 3, bogey 1, doble o peor 0.';
  else nota.textContent='Un punto por cada uno de los tres premios del hoyo.';
}

function pintaLead(){
  const {t}=totales(); const A=act();
  const arr=A.map(p=>({...p,pts:t[p.i]||0})).sort((a,b)=>b.pts-a.pts);
  const max=Math.max(1,...arr.map(a=>a.pts));
  document.getElementById('lead').innerHTML=arr.map((p,k)=>{
    const {g,n}=golpesTot(p.i);
    return `<div class="lrow ${k===0&&p.pts>0?'leader':''}">
      <div class="lpos">${k+1}</div>
      <div style="flex:1;min-width:0">
        <div class="lname">${esc(p.name||'Jugador '+(p.i+1))}</div>
        <div class="ptag">${n?g+' golpes en '+n+' hoyos':'sin golpes'}</div>
      </div>
      <div class="lbarwrap"><div class="lbar" style="width:${Math.round(p.pts/max*100)}%"></div></div>
      <div class="ltot">${Math.round(p.pts*10)/10}</div>
    </div>`;
  }).join('');
}

function corto(p,n){
  const s=(p.name||'').trim();
  if(!s || /^jugador\s*\d*$/i.test(s)) return 'J'+(p.i+1);
  return s.split(' ')[0].slice(0,n);
}
function pintaTarjeta(){
  const A=act();
  // puntos de cada hoyo ya resueltos (con bote en skins)
  const pts=Array.from({length:18},()=>({}));
  let bote=1;
  for(let h=0;h<18;h++){
    const P=puntosHoyo(h);
    if(!P) continue;
    if(S.mode==='skins'){
      const w=Object.keys(P).find(k=>P[k]===1);
      if(w!=null){ pts[h][w]=bote; bote=1; } else bote++;
    } else A.forEach(p=>pts[h][p.i]=P[p.i]||0);
  }
  const marca=(g,p,rec)=>{
    const d=(g-rec)-p;
    return d<=-1?'bird':d>=2?'dbl':d===1?'bog':'';
  };
  const bloque=(a,b,lab)=>{
    let t='<table class="sc"><tr class="hn"><td class="nm">Hoyo</td>';
    for(let h=a;h<b;h++) t+=`<td class="${h===S.hole?'now':''}"><button class="jump" data-j="${h}">${h+1}</button></td>`;
    t+=`<td class="tt">${lab}</td></tr>`;
    t+='<tr class="ref"><td class="nm">Par</td>';
    let sp=0; for(let h=a;h<b;h++){ sp+=S.par[h]; t+=`<td class="${h===S.hole?'now':''}">${S.par[h]}</td>`; }
    t+=`<td class="tt">${sp}</td></tr>`;
    t+='<tr class="ref"><td class="nm">Hcp</td>';
    for(let h=a;h<b;h++) t+=`<td class="${h===S.hole?'now':''}">${S.si[h]}</td>`;
    t+='<td class="tt"></td></tr>';
    A.forEach(p=>{
      let g=0,pt=0,net=0;
      t+=`<tr class="pl"><td class="nm">${esc(corto(p,6))}</td>`;
      for(let h=a;h<b;h++){
        const v=S.scores[h][p.i], rec=recibidos(p.hcp,S.si[h]);
        const q=pts[h][p.i];
        if(v!=null){ g+=v; net+=(v-rec)-S.par[h]; }
        if(q!=null) pt+=q;
        t+=`<td class="${h===S.hole?'now':''}">`+
           (v==null?'<div class="gs">·</div>':`<div class="gs ${marca(v,S.par[h],rec)}">${v}</div>`)+
           `<div class="ps">${q==null?'':Math.round(q*10)/10}</div></td>`;
      }
      t+=`<td class="tt"><div class="gs">${g||''}</div><div class="ps big">${pt||''}</div>`+
         (g?`<div class="net ${net<0?'under':net>0?'over':'even'}">${net>0?'+':net===0?'E':''}${net!==0?net:''}</div>`:'')+
         '</td></tr>';
    });
    return t+'</table>';
  };

  // resumen final
  let res='<table class="sc fin"><tr class="hn"><td class="nm">Total</td><td>Puntos</td><td>Golpes</td><td>Neto</td></tr>';
  A.forEach(p=>{
    let g=0,pt=0,net=0;
    for(let h=0;h<18;h++){
      const v=S.scores[h][p.i];
      if(v!=null){ g+=v; net+=(v-recibidos(p.hcp,S.si[h]))-S.par[h]; }
      if(pts[h][p.i]!=null) pt+=pts[h][p.i];
    }
    res+=`<tr class="pl"><td class="nm">${esc(corto(p,9))}</td>`+
      `<td class="ps big">${Math.round(pt*10)/10}</td><td class="gs">${g||'—'}</td>`+
      `<td>${g?`<span class="net ${net<0?'under':net>0?'over':'even'}">${net>0?'+':net===0?'E':''}${net!==0?net:''}</span>`:''}</td></tr>`;
  });
  res+='</table>';

  document.getElementById('cardTable').innerHTML=bloque(0,9,'Ida')+bloque(9,18,'Vta')+res;
  document.querySelectorAll('.jump').forEach(b=>b.onclick=()=>{
    S.hole=+b.dataset.j; save(); pintaHoyo(); pintaTarjeta(); irA('hoyo');
  });
  const lg=document.getElementById('cardLegend');
  if(lg) lg.innerHTML='Arriba los golpes, debajo los puntos. El círculo es birdie o mejor y el cuadrado, bogey o peor, '+
    (S.net?'contando ya los golpes de hándicap':'en bruto')+'. A la derecha, el acumulado sobre el par de cada nueve. Toca un número de hoyo para ir a él.';
}

function pintaAjustes(){
  const sl=document.getElementById('slots');
  sl.innerHTML=S.players.map((p,i)=>`
    <div class="slot">
      <div class="n"><label>Jugador ${i+1}</label><input data-n="${i}" value="${esc(p.name)}" placeholder="Nombre"></div>
      <div class="h"><label>Hcp</label><input data-h="${i}" type="number" inputmode="numeric" value="${p.hcp}"></div>
      <button class="x" data-o="${i}" title="Activar o quitar">${p.on?'✓':'＋'}</button>
    </div>`).join('')+'<p class="note">Toca el botón de la derecha para meter o sacar a un jugador de la partida.</p>';
  sl.querySelectorAll('[data-n]').forEach(el=>el.oninput=()=>{S.players[+el.dataset.n].name=el.value;save();pintaHoyo();pintaTarjeta();});
  sl.querySelectorAll('[data-h]').forEach(el=>el.oninput=()=>{S.players[+el.dataset.h].hcp=+el.value||0;save();pintaHoyo();pintaTarjeta();});
  sl.querySelectorAll('[data-o]').forEach(el=>el.onclick=()=>{
    const i=+el.dataset.o;
    if(S.players[i].on && act().length<=2) return;
    S.players[i].on=!S.players[i].on; save(); pintaAjustes(); pintaHoyo(); pintaTarjeta();
  });

  document.getElementById('modeBtns').innerHTML=Object.entries(MODES).map(([k,m])=>
    `<button class="mode ${S.mode===k?'on':''}" data-mo="${k}"><b>${m.n}</b><span>${m.d}</span></button>`).join('');
  document.querySelectorAll('[data-mo]').forEach(b=>b.onclick=()=>{
    S.mode=b.dataset.mo; save(); pintaAjustes(); pintaHoyo(); pintaTarjeta();
  });

  document.getElementById('swNet').className='sw'+(S.net?' on':'');
  document.getElementById('swNet').onclick=()=>{S.net=!S.net;save();pintaAjustes();pintaHoyo();pintaTarjeta();};

  const cn=document.getElementById('cName'); cn.value=S.name;
  cn.oninput=()=>{S.name=cn.value;save();document.getElementById('courseName').textContent=S.name;};

  document.getElementById('courseGrid').innerHTML=S.par.map((p,i)=>`
    <div class="hcell"><div class="hn">Hoyo ${i+1}</div>
      <div class="lb">Par</div><input data-par="${i}" type="number" inputmode="numeric" value="${p}">
      <div class="lb">Hcp</div><input data-si="${i}" type="number" inputmode="numeric" value="${S.si[i]}">
    </div>`).join('');
  document.querySelectorAll('[data-par]').forEach(el=>el.onchange=()=>{S.par[+el.dataset.par]=+el.value||4;save();pintaHoyo();pintaTarjeta();});
  document.querySelectorAll('[data-si]').forEach(el=>el.onchange=()=>{S.si[+el.dataset.si]=+el.value||1;save();pintaHoyo();pintaTarjeta();});

  document.getElementById('resetBtn').onclick=()=>{
    if(!confirm('Se borran los golpes de los 18 hoyos. ¿Empezamos partida nueva?')) return;
    const keep={players:S.players,mode:S.mode,net:S.net,par:S.par,si:S.si,name:S.name};
    S=Object.assign(fresh(),keep); save(); pintaTodo(); irA('hoyo');
  };
}

function esc(s){return String(s??'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));}
function pintaTodo(){pintaHoyo();pintaTarjeta();pintaAjustes();}
function irA(v){
  ['hoyo','tarjeta','ajustes'].forEach(x=>document.getElementById('view-'+x).classList.toggle('hidden',x!==v));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  document.getElementById('holebar').classList.toggle('hidden',v==='ajustes');
  window.scrollTo(0,0);
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>irA(b.dataset.v));
document.getElementById('prevH').onclick=()=>{if(S.hole>0){S.hole--;save();pintaHoyo();pintaTarjeta();}};
document.getElementById('nextH').onclick=()=>{if(S.hole<17){S.hole++;save();pintaHoyo();pintaTarjeta();}};

S=load(); pintaTodo();
</script>
